rules:
  - id: python.state-write-after-untrusted-external-call
    languages: [python]
    severity: WARNING
    message: >-
      Public function `$F` makes an external call (`$MOD.$M(...)`) and then
      writes state using the result (`$R`). Validate or sanitize the response
      first, and avoid committing state derived from untrusted data until the
      checks have passed.
    metadata:
      category: security
      invariant: state mutation following an external untrusted interaction
    patterns:
      - pattern-either:
          - pattern: |
              def $F(...):
                ...
                $R = <... $MOD.$M(...) ...>
                ...
                self.$ATTR = <... $R ...>
          - pattern: |
              def $F(...):
                ...
                $R = <... $MOD.$M(...) ...>
                ...
                self.$ATTR[$K] = <... $R ...>
          - pattern: |
              async def $F(...):
                ...
                $R = <... $MOD.$M(...) ...>
                ...
                self.$ATTR = <... $R ...>
          - pattern: |
              async def $F(...):
                ...
                $R = <... $MOD.$M(...) ...>
                ...
                self.$ATTR[$K] = <... $R ...>
      - metavariable-regex:
          metavariable: $F
          regex: ^[^_].*
      - metavariable-regex:
          metavariable: $MOD
          regex: ^(requests|httpx|subprocess)$
