rules:
  - id: state.mutation.external.untrusted
    languages: [python]
    severity: ERROR
    message: "Public function performs an external call to untrusted input and then writes contract state."
    pattern: |
      def $FUNC_NAME(...):
          ...
          $RESPONSE = requests.get(...)  # or httpx.get(...) or subprocess.run(...)
          ...
          $STATE_WRITE = $RESPONSE  # State mutation using the response
    metadata:
      severity: ERROR
