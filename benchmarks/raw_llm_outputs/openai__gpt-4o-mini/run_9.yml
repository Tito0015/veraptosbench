rules:
  - id: state.mutation.external.interaction
    languages: [python]
    severity: ERROR
    message: "State mutation following an external untrusted interaction detected."
    pattern: |
      def $FUNC(...):
          ...
          $RESPONSE = requests.get(...)  # or httpx.get(...) or subprocess.run(...)
          ...
          $STATE = $RESPONSE.json()  # or any assignment using the response
