rules:
  - id: state.mutation.external.untrusted
    languages: [python]
    severity: ERROR
    message: "State mutation following an external untrusted interaction"
    pattern: |
      def $FUNC(...):
          $RESPONSE = requests.get(...)  # or httpx.get(...) or subprocess.run(...)
          $STATE = $RESPONSE.json()  # or any assignment that uses the response
